name: Publish to npm

on:
  push:
    tags: ["v*"]
  # Re-publish the version currently on main without cutting a new tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never restore a cache into a release build

      # Trusted publishing needs npm >= 11.5.1. Node 24 bundles 11.19.1, while the
      # Node 22 this job used to run on bundles 10.9.9, which has no OIDC support.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci
        env:
          # CPU binaries ship in the package; skip the optional CUDA download
          # (a large network fetch on linux/x64 that can time out).
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: the OIDC token minted by id-token: write is the credential.
      - name: Publish to npm
        run: npm publish --access public --provenance

  # Split out so the publish job keeps contents: read — only this one needs write.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
